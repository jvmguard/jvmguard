name: docs-deploy

on:
  workflow_call:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        locale: [en, ko, ja, zh-CN]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Generate screenshots (${{ matrix.locale }})
        run: |
          ./gradlew :ui:screenshots :ui:darkScreenshots -Pjvmguard.screenshots.locale=${{ matrix.locale }} --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1500M -Dkotlin.daemon.jvm.options=-Xmx2G --no-watch-fs

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.locale }}
          path: |
            build/gradle/ui/e2e/screenshotsLight/${{ matrix.locale }}/
            build/gradle/ui/e2e/screenshotsDark/${{ matrix.locale }}/
          retention-days: 1

  build:
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            modules/docs/package-lock.json
            modules/website/package-lock.json

      - name: Download screenshots
        uses: actions/download-artifact@v7
        with:
          pattern: screenshots-*
          path: screenshot-artifacts

      - name: Merge screenshot artifacts
        run: |
          mkdir -p build/gradle/ui/e2e
          cp -r screenshot-artifacts/screenshots-*/. build/gradle/ui/e2e/

      - name: Fetch latest release info for website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p modules/website/src/data
          gh api repos/jvmguard/jvmguard/releases/latest --jq '{
            version: .tag_name | ltrimstr("v"),
            tag: .tag_name,
            assets: [.assets[] | {name: .name, url: .browser_download_url}],
            published_at: .published_at
          }' > modules/website/src/data/latest-release.json || echo '{"version":"","tag":"","assets":[],"published_at":""}' > modules/website/src/data/latest-release.json

      - name: Fetch auto-update XML from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p modules/website/public
          gh release download --pattern 'updates.xml' --dir modules/website/public/ || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Javadoc
        run: ./gradlew :website:copyJavadoc

      - name: Assemble screenshots into the sites
        run: ./gradlew :docs:copyScreenshots :website:copyScreenshots

      - name: Build marketing site
        working-directory: modules/website
        run: |
          npm ci
          npm run build

      - name: Build docs site
        working-directory: modules/docs
        run: |
          npm ci
          npm run build

      - name: Combine sites
        run: |
          mkdir -p modules/website/dist/docs
          cp -r modules/docs/dist/. modules/website/dist/docs/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: modules/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
